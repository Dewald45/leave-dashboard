# Leave Dashboard — self-hosted stack (app + Postgres).
# Copy .env.docker.example to .env and fill it in, then: docker compose up -d --build
# In Portainer, paste this as a stack and provide the same variables.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-leave}
    volumes:
      - leave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leave} -d ${POSTGRES_DB:-leave}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    # For a registry-based deploy, comment out `build:` and use:
    # image: ghcr.io/dewald45/leave-dashboard:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-leave}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leave}
      APP_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Leave Dashboard <onboarding@resend.dev>}
      # First-run admin seed (only creates the user if it doesn't exist yet):
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrator}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  leave_pgdata:
